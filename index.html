<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iGEM Renata</title>
  <meta
    name="description"
    content="iGEM Renata website with immersive interactive animations, PCS workflow storytelling, and a polished rebirth-inspired design."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <div class="custom-cursor" id="customCursor"></div>
  <div class="custom-cursor-dot" id="customCursorDot"></div>

  <div class="scroll-progress" id="scrollProgress"></div>

  <div class="scroll-trail">
    <div class="scroll-trail-fill" id="scrollTrailFill"></div>
  </div>

  <div class="aurora-layer"></div>
  <div class="grid-overlay"></div>
  <div class="grain-overlay"></div>

  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <div class="ember-field" id="emberField" aria-hidden="true"></div>

  <header class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="#home" class="brand magnetic" data-magnetic>
        <div class="brand-logo-wrap">
          <img src="assets/logo.png" alt="iGEM Renata logo" class="brand-logo" />
        </div>
        <span>iGEM Renata</span>
      </a>

      <nav class="nav-links">
        <a href="#about">About</a>
        <a href="#project">Project</a>
        <a href="#pcs">PCS</a>
        <a href="#judging">Judging</a>
        <a href="#team">Team</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero section" id="home">
      <div class="hero-spotlight" id="heroSpotlight"></div>

      <div class="hero-rings" aria-hidden="true">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
      </div>

      <div class="container hero-grid">
        <div class="hero-copy reveal parallax-element" data-parallax-speed="0.10">
          <div class="eyebrow" id="heroEyebrow"></div>
          <h1 id="heroTitle"></h1>
          <p class="hero-lead" id="heroLead"></p>

          <div class="hero-stat-row" id="heroStats"></div>

          <div class="buttons">
            <a href="#project" class="btn btn-primary magnetic" data-magnetic id="heroPrimaryBtn"></a>
            <a href="#pcs" class="btn btn-secondary magnetic" data-magnetic id="heroSecondaryBtn"></a>
          </div>

          <div class="scroll-cue">
            <div class="scroll-cue-mouse"></div>
            <span id="scrollCueText"></span>
          </div>
        </div>

        <div class="hero-card-wrap reveal delay-1 parallax-element" data-parallax-speed="0.16">
          <div class="hero-card-glow"></div>

          <div class="hero-card" id="heroCard">
            <div class="hero-card-inner">
              <img src="assets/logo.png" alt="iGEM Renata logo" class="hero-logo" id="heroLogo" />
            </div>
          </div>

          <div class="hero-badge-stack" id="heroBadges"></div>
        </div>
      </div>
    </section>

    <div class="section-divider" aria-hidden="true">
      <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
        <path
          fill="#ffffff"
          fill-opacity="0.96"
          d="M0,64L72,69.3C144,75,288,85,432,80C576,75,720,53,864,53.3C1008,53,1152,75,1296,85.3C1368,91,1404,96,1422,98.7L1440,101L1440,120L0,120Z"
        ></path>
      </svg>
    </div>

    <section class="section" id="about">
      <div class="container">
        <div class="section-heading reveal">
          <div class="section-chip" id="aboutChip"></div>
          <h2 id="aboutTitle"></h2>
          <p id="aboutLead"></p>
        </div>

        <div class="cards" id="aboutCards"></div>
      </div>
    </section>

    <div class="section-divider" aria-hidden="true">
      <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
        <path
          fill="#fff9f4"
          fill-opacity="0.98"
          d="M0,96L80,85.3C160,75,320,53,480,53.3C640,53,800,75,960,74.7C1120,75,1280,53,1360,42.7L1440,32L1440,120L0,120Z"
        ></path>
      </svg>
    </div>

    <section class="section highlight-section" id="project">
      <div class="container">
        <div class="section-heading reveal">
          <div class="section-chip" id="projectChip"></div>
          <h2 id="projectTitle"></h2>
          <p id="projectLead"></p>
        </div>

        <div class="cards" id="projectCards"></div>
      </div>
    </section>

    <div class="section-divider" aria-hidden="true">
      <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
        <path
          fill="#f5faff"
          fill-opacity="0.98"
          d="M0,32L90,42.7C180,53,360,75,540,74.7C720,75,900,53,1080,53.3C1260,53,1350,75,1395,85.3L1440,96L1440,120L0,120Z"
        ></path>
      </svg>
    </div>

    <section class="section pcs-section" id="pcs">
      <div class="container">
        <div class="section-heading reveal">
          <div class="section-chip" id="pcsChip"></div>
          <h2 id="pcsTitle"></h2>
          <p id="pcsLead"></p>
        </div>

        <div class="pcs-grid">
          <div class="pcs-rail-panel reveal">
            <div class="pcs-rail-title" id="pcsRailTitle"></div>

            <div class="pcs-rail" id="pcsRail">
              <div class="pcs-rail-fill" id="pcsRailFill"></div>
              <div id="pcsDots"></div>
            </div>
          </div>

          <div class="pcs-steps" id="pcsSteps"></div>
        </div>
      </div>
    </section>

    <div class="section-divider" aria-hidden="true">
      <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
        <path
          fill="#ffffff"
          fill-opacity="0.98"
          d="M0,96L90,85.3C180,75,360,53,540,48C720,43,900,53,1080,64C1260,75,1350,85,1395,90.7L1440,96L1440,120L0,120Z"
        ></path>
      </svg>
    </div>

    <section class="section" id="judging">
      <div class="container">
        <div class="section-heading reveal">
          <div class="section-chip" id="judgingChip"></div>
          <h2 id="judgingTitle"></h2>
          <p id="judgingLead"></p>
        </div>

        <div class="cards" id="judgingCards"></div>
      </div>
    </section>

    <section class="section" id="team">
      <div class="container">
        <div class="section-heading reveal">
          <div class="section-chip" id="teamChip"></div>
          <h2 id="teamTitle"></h2>
          <p id="teamLead"></p>
        </div>

        <div class="cards" id="teamCards"></div>
      </div>
    </section>

    <section class="section" id="contact">
      <div class="container">
        <div class="contact-box reveal tilt-card">
          <div>
            <div class="section-chip" id="contactChip"></div>
            <h2 id="contactTitle"></h2>
            <p id="contactLead"></p>
          </div>

          <a href="#" class="btn btn-primary magnetic" data-magnetic id="contactButton"></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <p id="footerLeft"></p>
      <p id="footerRight"></p>
    </div>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/render.js"></script>
  <script src="js/interactions.js"></script>
</body>
</html>
